# Config minima local: nome da aplicacao (usado para buscar
# "clientes-service.properties" no config-server) e o endereco do config-server.
# O restante das configuracoes (porta, datasource, eureka...) vem do
spring.application.name=fornecedores-service
spring.config.import=optional:configserver:http://localhost:8888

server.port=8084

# H2
spring.datasource.url=jdbc:h2:mem:fornecedoresdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.fetch-registry=true
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true